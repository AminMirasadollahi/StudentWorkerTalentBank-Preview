name: Management Draft PR Safety Gate (NO DEPLOY)

on:
  # Non-deploy verification of this review branch, independent of PR creation.
  push:
    branches: [review/operations-ui-readonly-lifecycle-2026-10-13, feat/worker-focus-weekly-4slots-2026-10-13, feat/unified-focus-presence-profiles-2026-10-13, feat/integrated-operations-v2-2026-10-14]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/operations-release-review.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non_deploy_release_review:
    name: Production intake lock, synthetic React tests and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing preview app dependencies
        run: npm install --no-audit --no-fund
      - name: Install jsdom only for synthetic mounted React tests (not app dependency)
        run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@26.1.0
      - name: Verify protected public baselines and synthetic task/history/React tests
        # Each mounted test module runs in a separate Node process. This
        # protects Vite SSR websocket port 24678 and makes leaked handles,
        # stalled imports or dependency-scanning failures attributable to
        # a specific file rather than hanging an opaque whole-suite run.
        # No test file is skipped; each runner must exit successfully.
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.mjs; do
            echo "::group::SWTB_NODE_FILE=$test_file"
            if timeout --signal=TERM --kill-after=5s 65s node --test "$test_file"; then
              echo "SWTB_NODE_FILE_PASS=$test_file"
            else
              status=$?
              echo "::error::SWTB_NODE_FILE_FAILED=$test_file status=$status"
              exit "$status"
            fi
            echo "::endgroup::"
          done
          echo 'SWTB_ALL_NODE_FILES_PASS'
      - name: Build EXACT public Vite entrypoint — without any deployment
        run: npm run build
      - name: Confirm normal HTML entry does not load synthetic QA
        run: |
          if grep -Eiq 'operations-qa|lifecycle-qa|/src/qa/' dist/index.html; then
            echo "STOP: QA entry in public HTML" >&2
            exit 1
          fi
          echo "PASS: release review built without deploying and without QA entrypoints"

      # SWTB7: one real-browser smoke only on the isolated worker redesign PR.
      # No public Pages deployment, no production auth or real Supabase calls.
      - name: Install Chromium smoke dependencies (draft worker branch only)
        if: github.event_name == 'pull_request' && (github.head_ref == 'feat/worker-desktop-ux-stage1-2026-10-23' || (github.head_ref == 'feat/swtb7-action-first-worker-desk-2026-10-24' || (github.head_ref == 'feat/swtb8-worker-workspace-b3-react-2026-10-31' || github.head_ref == 'feat/swtb9-settings-task-unit-ledger-2026-10-31' || github.head_ref == 'feat/swtb10-worker-density-inspector-account-2026-10-31' || github.head_ref == 'feat/swtb11-b3-account-visible-inspectors-unified-hours-2026-10-31' || github.head_ref == 'feat/swtb13-worker-contextual-guide-2026-11-03' || github.head_ref == 'feat/swtb14-worker-help-micro-polish-2026-11-03' || github.head_ref == 'feat/swtb15-manager-library-duty-template-2026-11-03' || github.head_ref == 'feat/swtb17-library-desk-shift-editor-2026-11-03')))
        run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@26.1.0 playwright@1.56.1
      - name: Use preinstalled Chrome on GitHub Ubuntu runner for isolated smoke
        if: github.event_name == 'pull_request' && (github.head_ref == 'feat/worker-desktop-ux-stage1-2026-10-23' || (github.head_ref == 'feat/swtb7-action-first-worker-desk-2026-10-24' || (github.head_ref == 'feat/swtb8-worker-workspace-b3-react-2026-10-31' || github.head_ref == 'feat/swtb9-settings-task-unit-ledger-2026-10-31' || github.head_ref == 'feat/swtb10-worker-density-inspector-account-2026-10-31' || github.head_ref == 'feat/swtb11-b3-account-visible-inspectors-unified-hours-2026-10-31' || github.head_ref == 'feat/swtb13-worker-contextual-guide-2026-11-03' || github.head_ref == 'feat/swtb14-worker-help-micro-polish-2026-11-03' || github.head_ref == 'feat/swtb15-manager-library-duty-template-2026-11-03' || github.head_ref == 'feat/swtb17-library-desk-shift-editor-2026-11-03')))
        run: google-chrome --version
      - name: Smoke native worker dialogs and calendar with fake data (NO NETWORK / NO DEPLOY)
        if: github.event_name == 'pull_request' && (github.head_ref == 'feat/worker-desktop-ux-stage1-2026-10-23' || (github.head_ref == 'feat/swtb7-action-first-worker-desk-2026-10-24' || (github.head_ref == 'feat/swtb8-worker-workspace-b3-react-2026-10-31' || github.head_ref == 'feat/swtb9-settings-task-unit-ledger-2026-10-31' || github.head_ref == 'feat/swtb10-worker-density-inspector-account-2026-10-31' || github.head_ref == 'feat/swtb11-b3-account-visible-inspectors-unified-hours-2026-10-31' || github.head_ref == 'feat/swtb13-worker-contextual-guide-2026-11-03' || github.head_ref == 'feat/swtb14-worker-help-micro-polish-2026-11-03' || github.head_ref == 'feat/swtb15-manager-library-duty-template-2026-11-03' || github.head_ref == 'feat/swtb17-library-desk-shift-editor-2026-11-03')))
        run: node tests/browser/run-worker-smoke.mjs
      - name: SWTB17 native Chrome manager desk time and occupancy acceptance (fake backend)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/swtb17-library-desk-shift-editor-2026-11-03'
        run: node tests/browser/run-manager-desk-smoke.mjs
      - name: Upload SWTB17 synthetic-only manager desk screenshots
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/swtb17-library-desk-shift-editor-2026-11-03'
        uses: actions/upload-artifact@v4
        with:
          name: swtb17-manager-desk-visual-qa
          path: test-results/swtb17-manager-desk/
          if-no-files-found: ignore
          retention-days: 3
      - name: Attach synthetic-only Chromium screenshots for PR review
        if: always() && github.event_name == 'pull_request' && (github.head_ref == 'feat/worker-desktop-ux-stage1-2026-10-23' || (github.head_ref == 'feat/swtb7-action-first-worker-desk-2026-10-24' || (github.head_ref == 'feat/swtb8-worker-workspace-b3-react-2026-10-31' || github.head_ref == 'feat/swtb9-settings-task-unit-ledger-2026-10-31' || github.head_ref == 'feat/swtb10-worker-density-inspector-account-2026-10-31' || github.head_ref == 'feat/swtb11-b3-account-visible-inspectors-unified-hours-2026-10-31' || github.head_ref == 'feat/swtb13-worker-contextual-guide-2026-11-03' || github.head_ref == 'feat/swtb14-worker-help-micro-polish-2026-11-03' || github.head_ref == 'feat/swtb15-manager-library-duty-template-2026-11-03' || github.head_ref == 'feat/swtb17-library-desk-shift-editor-2026-11-03')))
        uses: actions/upload-artifact@v4
        with:
          name: swtb7-isolated-desktop-chromium
          path: test-results/swtb7-desktop-browser/
          if-no-files-found: ignore
          retention-days: 3
