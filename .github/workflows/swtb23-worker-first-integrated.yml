name: SWTB23 Worker First integrated review (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: swtb23-integrated-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/swtb23-worker-first-integrated-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Integrated new contract and mounted delta
        run: node --test tests/assignmentPrerequisitesV3.test.mjs tests/assignmentPrerequisitesV3Mounted.test.mjs tests/assignmentRecoverySession.test.mjs tests/recoveryAccessBinding.test.mjs tests/recoveryReviewLifecycle.test.mjs tests/scopedRecoveryHttpTransport.test.mjs tests/assignmentRecoveryHostMounted.test.mjs tests/workerPolicySnapshot.test.mjs tests/taskPrerequisiteEditor.test.mjs tests/workerReportContract.test.mjs tests/workerReportContractUi.test.mjs tests/workerReportRetry.test.mjs tests/workerTaskFocus.test.mjs tests/swtb21WorkerWorkWorkspace.test.mjs
      - name: Build strict release candidate (synthetic configuration)
        env:
          VITE_SWTB23_WORKER_POLICY_RELEASE: 'true'
          VITE_SWTB22_RECOVERY_REVIEW_UI: 'true'
          VITE_SWTB22_RECOVERY_REVIEW_PROJECT_REF: aaaaaaaaaaaaaaaaaaaa
          VITE_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_build_only
        run: npm run build -- --outDir /tmp/swtb23-integrated-build
      - name: Native Chrome strict worker policy (synthetic)
        env:
          VITE_SWTB23_WORKER_POLICY_RELEASE: 'true'
        run: |
          google-chrome --version
          export SWTB23_BROWSER_TOOL_DIR="$RUNNER_TEMP/swtb23-integrated-browser"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$SWTB23_BROWSER_TOOL_DIR" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node tests/browser/run-swtb23-r3-worker-smoke.mjs
