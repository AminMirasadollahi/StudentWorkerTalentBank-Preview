name: SWTB27 day-batch mounted review (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: swtb27-day-batch-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/swtb27-day-batch-contract-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Consolidated day-batch source and actual React mounted regression
        run: node --test --test-concurrency=1 --test-timeout=20000 tests/swtb27DayBatchAssignmentContract.test.mjs tests/swtb27DayBatchManagerSession.test.mjs tests/swtb27DayBatchSharedManager.test.mjs tests/swtb27DayBatchVerifiedOwner.test.mjs tests/swtb27DayBatchMounted.test.mjs tests/swtb27DayBatchWorkspaceRead.test.mjs tests/swtb27DeskCancellationObservation.test.mjs tests/swtb24R5BatchPreview.test.mjs tests/assignmentPrerequisitesV3Mounted.test.mjs tests/assignmentRecoveryHostMounted.test.mjs tests/releaseBoundary.test.mjs
      - name: Confirm normal entry has no mounted review owner
        run: |
          if grep -nE 'DayBatchManagerReviewHost|dayBatchVerifiedOwner' src/OpsApp.jsx src/App.jsx index.html; then exit 1; fi
          echo PASS NO_REVIEW_OWNER_IN_NORMAL_ENTRY
      - name: Native Chrome day-batch review (loopback only)
        run: |
          google-chrome --version
          export SWTB23_BROWSER_TOOL_DIR="$RUNNER_TEMP/swtb27-day-batch-browser"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$SWTB23_BROWSER_TOOL_DIR" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node tests/browser/run-swtb27-day-batch-review.mjs
          node tests/browser/run-swtb27-day-batch-workspace.mjs
          node tests/browser/run-swtb27-day-batch-opsapp.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swtb27-day-batch-synthetic
          path: |
            test-results/swtb27-day-batch-synthetic
            test-results/swtb27-workspace-synthetic
            test-results/swtb27-opsapp-synthetic
          retention-days: 7
