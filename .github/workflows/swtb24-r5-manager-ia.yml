name: SWTB24 R5 manager IA review (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: swtb24-r5-ia-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'review/swtb24-r5-manager-ia-20261126' || github.event.pull_request.head.ref == 'review/swtb27-day-batch-contract-20261128')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: R5 grouped navigation, mounted shell and receipt boundary
        run: node --test tests/swtb24R5BatchPreview.test.mjs tests/swtb24R5DraftGuard.test.mjs tests/assignmentPrerequisitesV3Mounted.test.mjs tests/workPoolUnifiedMounted.test.mjs tests/assignmentRecoveryHostMounted.test.mjs tests/swtb24R5ManagerIa.test.mjs tests/managerWorkspaceNavUi.test.mjs tests/managerShellFeatureOnIntegration.test.mjs tests/workPoolRouteFence.test.mjs tests/releaseBoundary.test.mjs
      - name: Build strict release candidate (synthetic configuration)
        env:
          VITE_SWTB23_WORKER_POLICY_RELEASE: 'true'
          VITE_SWTB22_RECOVERY_REVIEW_UI: 'true'
          VITE_SWTB22_RECOVERY_REVIEW_PROJECT_REF: aaaaaaaaaaaaaaaaaaaa
          VITE_SWTB24_R5_MANAGER_IA_UI: 'true'
          VITE_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_build_only
        run: npm run build -- --outDir /tmp/swtb23-integrated-build
      - name: Native Chrome six-space visual review (synthetic only)
        run: |
          google-chrome --version
          export SWTB23_BROWSER_TOOL_DIR="$RUNNER_TEMP/swtb24-r5-browser"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$SWTB23_BROWSER_TOOL_DIR" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node tests/browser/run-swtb24-r5-manager-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swtb24-r5-manager-synthetic-review
          path: test-results/swtb24-r5-ia-synthetic
          retention-days: 7
